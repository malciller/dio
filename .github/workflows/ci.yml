name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ----- OCaml tool-chain -------------------------------------------------
      - uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: '4.14.2'      # ⇐ same switch you use locally
          dune-cache: true              # re-uses _build between steps

      # ----- Install project dependencies ------------------------------------
      - name: Install deps
        run: opam install . --deps-only --with-test -y

      # ----- Build and run test suite ----------------------------------------
      - name: Build
        run: dune build @all

      - name: Run tests
        run: dune runtest
